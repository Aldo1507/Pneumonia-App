<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pneumonia Detection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🫁 Pneumonia Detection</h1>
      <p class="subtitle">Upload a chest X-ray to detect pneumonia using AI</p>

      <div
        class="upload-area"
        onclick="document.getElementById('imageInput').click()"
      >
        <input type="file" id="imageInput" accept="image/*" />
        <img id="preview" alt="Preview" />
        <div id="uploadText">
          📁 Click to upload X-ray image<br />
          <small style="color: #999">or drag and drop</small>
        </div>
      </div>

      <button id="predictBtn">Analyze Image</button>

      <div id="result" class="result"></div>
    </div>

    <script type="module" src="pneumoniaApi.js"></script>
  </body>
</html>
